name: dinewise
description: "Dinewise: order from Tadka Lane, and run its kitchen."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.4
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled, never fetched at runtime. Both families are SIL Open Font License 1.1
  # (assets/fonts/*-OFL.txt); static instances cut from the upstream variable fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700

# `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#c2410c"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21

# `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#fdf8f0"
  image: assets/branding/splash.png
  android_12:
    color: "#fdf8f0"
    image: assets/branding/icon_foreground.png
    icon_background_color: "#c2410c"
